<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuyfaProg | Разработка сайтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .highlight {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            display: inline-block;
            padding-bottom: 5px;
        }

        .services {
            text-align: left;
            margin: 30px 0;
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
        }

        .services h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .services ul {
            list-style: none;
        }

        .services li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .services li:before {
            content: "✓";
            color: #764ba2;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .contact {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 40px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        .contact:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .domain-status {
            margin-top: 30px;
            font-size: 0.85em;
            color: #888;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Quyfa<span class="highlight">Prog</span></h1>
        <div class="tagline">Разработка сайтов под ключ</div>

        <div class="services">
            <h3>Что мы делаем:</h3>
            <ul>
                <li>Лендинги и визитки</li>
                <li>Интернет-магазины</li>
                <li>Адаптивная вёрстка</li>
                <li>Оптимизация скорости</li>
            </ul>
        </div>

        <a href="mailto:info@quyfaprog.apruxdomain.site" class="contact">Связаться с нами</a>

        <div class="domain-status">
            ✅ Сайт успешно работает на домене <strong>quyfaprog.apruxdomain.site</strong>
        </div>

        <footer>
            © 2025 QuyfaProg. Все права защищены.
        </footer>
    </div>
</body>
</html>
